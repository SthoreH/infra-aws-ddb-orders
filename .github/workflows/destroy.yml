name: Destroy

on:
  issues:
    types: [labeled]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  destroy:
    name: Terraform Destroy (dev)
    if: github.event.label.name == 'destroy-approved'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform-aws
    steps:
      - uses: actions/checkout@v4

      - name: Validate issue data
        id: validate
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          ENV=$(echo "$BODY" | grep -A2 "### Ambiente" | grep -E "^dev$" | tr -d '[:space:]')
          CONFIRM=$(echo "$BODY" | grep -A2 "### Confirmação" | grep -E "^DESTROY$" | tr -d '[:space:]')

          if [[ "$ENV" != "dev" ]]; then
            echo "Destroy de prod não é permitido via automação. Execute manualmente via CLI."
            exit 1
          fi

          if [[ "$CONFIRM" != "DESTROY" ]]; then
            echo "Confirmação inválida. O campo deve conter exatamente 'DESTROY'."
            exit 1
          fi

          echo "Validações OK — prosseguindo com destroy de dev."

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ github.event.repository.name }}/terraform.tfstate"

      - name: Terraform Destroy
        run: terraform destroy -var-file=environments/dev.tfvars -auto-approve

      - name: Comment and close issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const status = success ? '✅ Destroy concluído com sucesso' : '❌ Destroy falhou';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**${status}** no ambiente \`dev\`\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (success) {
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed'
              });
            }