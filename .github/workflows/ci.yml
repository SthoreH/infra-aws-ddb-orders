name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  id-token: write
  contents: read

jobs:
  validate-dev:
    name: Terraform Validate (dev)
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: danhenrique/github-actions-workflows/actions/terraform-validate@main
        with:
          working-directory: terraform-aws
          tfvars: environments/dev.tfvars
          tf-backend-bucket: ${{ vars.TF_STATE_BUCKET }}
          tf-backend-key: ${{ github.event.repository.name }}/terraform.tfstate
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}

  validate-prod:
    name: Terraform Validate (prod)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: danhenrique/github-actions-workflows/actions/terraform-validate@main
        with:
          working-directory: terraform-aws
          tfvars: environments/prod.tfvars
          tf-backend-bucket: ${{ vars.TF_STATE_BUCKET }}
          tf-backend-key: ${{ github.event.repository.name }}/terraform.tfstate
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
